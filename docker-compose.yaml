version: '3.8'

services:
  keycloak_db:
    image: postgres:14
    environment:
      POSTGRES_DB: keycloak_db
      POSTGRES_USER: keycloak_user
      POSTGRES_PASSWORD: keycloak_password
    volumes:
      - ./postgres-keycloak-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"

  openldap:
    image: osixia/openldap:1.5.0
    environment:
      LDAP_ORGANISATION: BionicPRO Representation
      LDAP_DOMAIN: example.com
      LDAP_ADMIN_PASSWORD: adminpassword
    command: --copy-service
    volumes:
      - ./ldap/config.ldif:/container/service/slapd/assets/config/bootstrap/ldif/custom/config.ldif
    ports:
      - "389:389"
      - "636:636"

  keycloak:
    image: quay.io/keycloak/keycloak:21.1
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak_db:5432/keycloak_db
      KC_DB_USERNAME: keycloak_user
      KC_DB_PASSWORD: keycloak_password
    command:
      - start-dev
      - --import-realm
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      - keycloak_db
      - openldap

  bionicpro-auth:
    build:
      context: ./bionicpro-auth
      dockerfile: Dockerfile
    environment:
      AUTH_KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      AUTH_KEYCLOAK_PUBLIC_URL: http://localhost:8080
      AUTH_REALM: reports-realm
      AUTH_CLIENT_ID: bionicpro-auth
      AUTH_CLIENT_SECRET: bionicpro-auth-secret-change-me
      AUTH_REDIRECT_URI: http://localhost:8000/auth/callback
      AUTH_FRONTEND_URL: http://localhost:3000
      AUTH_API_URL: http://reports-api:8000
      AUTH_SESSION_COOKIE_NAME: bionicpro_session
      AUTH_SESSION_TTL_SECONDS: "1800"
      AUTH_COOKIE_SECURE: "false"
      AUTH_COOKIE_SAMESITE: lax
    ports:
      - "8000:8000"
    depends_on:
      - keycloak

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      REACT_APP_AUTH_URL: http://localhost:8000
    depends_on:
      - bionicpro-auth
