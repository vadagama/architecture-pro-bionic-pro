# CDN-эмуляция (Задание 3): Nginx как reverse-proxy перед Minio (S3) с кэшем
# статических отчётов. Браузер скачивает отчёт отсюда напрямую, не нагружая ни
# reports-api, ни OLAP.
#
# Ключи объектов иммутабельны (версионируются data_version в HMAC), поэтому кэш
# можно держать агрессивно: свежесть гарантирует смена ключа, а не TTL.

proxy_cache_path /var/cache/nginx/reports
                 levels=1:2
                 keys_zone=reports_cache:10m
                 max_size=1g
                 inactive=30d
                 use_temp_path=off;

server {
    listen 80;
    server_name _;

    # Отдаём объекты Minio (path-style: /<bucket>/<key>).
    location / {
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # Кэширование готовых отчётов.
        proxy_cache reports_cache;
        proxy_cache_key $uri;                 # ключ иммутабелен → $uri достаточно
        proxy_cache_valid 200 30d;
        proxy_cache_valid 404 10s;
        proxy_ignore_headers Cache-Control Expires Set-Cookie;
        add_header X-Cache-Status $upstream_cache_status;

        # Браузер фронтенда (другой origin) забирает отчёт fetch'ем.
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cache-Control "public, max-age=2592000, immutable";
    }
}
